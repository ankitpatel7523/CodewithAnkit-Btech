<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.card{
  max-width:420px;margin:30px auto;background:#fff;
  padding:25px;border-radius:12px;
  box-shadow:0 4px 25px rgba(0,0,0,.12)
}
input,button{
  width:100%;padding:12px;margin:8px 0;
  border:1px solid #ccc;border-radius:8px;font-size:16px
}
button{background:#0a84ff;color:white;border:none;cursor:pointer}
button:disabled{background:#bbb;cursor:not-allowed}
</style>
</head>

<body>

<div class="card">
<h2>Login / Register</h2>

<input id="name" placeholder="Your Name">
<input id="college" placeholder="College Name">
<input id="email" placeholder="Email ID">
<input id="phone" placeholder="+91...">

<div id="recaptcha-container"></div>

<button id="sendotp">Send OTP</button>

<div id="otpBox" style="display:none;">
  <input id="otp" placeholder="Enter OTP">
  <button id="verify">Verify OTP</button>
</div>

<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

import firebaseConfig from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ----------------------------
// RECAPTCHA INIT
// ----------------------------
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  { size: "invisible" }
);

let confirmation;

// ----------------------------
// SEND OTP BUTTON
// ----------------------------
document.getElementById("sendotp").onclick = async () => {

  const phone = document.getElementById("phone").value.trim();
  const name  = document.getElementById("name").value.trim();
  const col   = document.getElementById("college").value.trim();
  const email = document.getElementById("email").value.trim();
  const msg   = document.getElementById("msg");

  if(!phone || !name || !col || !email){
    msg.innerHTML="⚠ Please fill all fields.";
    return;
  }

  msg.innerHTML="⏳ Sending OTP...";

  try{
    confirmation = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
    msg.innerHTML="✔ OTP Sent Successfully!";
    document.getElementById("otpBox").style.display="block";
  }
  catch(err){
    msg.innerHTML="❌ Error: " + err.message;
  }
};

// ----------------------------
// VERIFY OTP BUTTON
// ----------------------------
document.getElementById("verify").onclick = async () => {
  const otp = document.getElementById("otp").value.trim();
  const msg = document.getElementById("msg");

  try{
    await confirmation.confirm(otp);
    msg.innerHTML="🎉 Login Successful!";
    setTimeout(()=> window.location.href="index.html", 1200);
  }
  catch(err){
    msg.innerHTML="❌ Invalid OTP.";
  }
};

</script>
</body>
</html>
