<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{
  max-width:420px;margin:20px auto;background:#fff;padding:20px;
  border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)
}
input,button{
  width:100%;margin:8px 0;padding:12px;
  border-radius:6px;border:1px solid #ccc;font-size:16px;
}
button{
  background:#007bff;color:#fff;border:none;cursor:pointer;font-weight:bold
}
button:disabled{background:#999;cursor:not-allowed}
#recaptcha-container{margin-top:10px;}
</style>

</head>
<body>

<div class="card">
<h2>Login / Register</h2>

<input id="name" placeholder="Your Name">
<input id="college" placeholder="College Name">
<input id="email" placeholder="Gmail ID">
<input id="phone" placeholder="+91...">

<div id="recaptcha-container"></div>

<button id="sendotp">Send OTP</button>

<div id="otpBox" style="display:none">
  <input id="otp" placeholder="Enter OTP">
  <button id="verify">Verify & Login</button>
</div>

<p id="msg"></p>
</div>


<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Firebase Config File -->
<script type="module" src="./firebase-config.js"></script>

<script type="module">

import firebaseConfig from "./firebase-config.js";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let recaptcha = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
  size: "invisible"
});
recaptcha.render();

const sendBtn = document.getElementById("sendotp");
const verifyBtn = document.getElementById("verify");
const msg = document.getElementById("msg");

// -----------------------
// SEND OTP
// -----------------------
sendBtn.onclick = () => {

  let name = name.value.trim();
  let college = college.value.trim();
  let email = email.value.trim();
  let phone = phone.value.trim();

  if(!name || !college || !email || !phone){
    msg.innerHTML = "⚠ Please fill all fields!";
    return;
  }

  msg.innerHTML = "⏳ Sending OTP...";

  auth.signInWithPhoneNumber(phone, recaptcha)
    .then((result) => {
      window.confirmationResult = result;
      msg.innerHTML = "✔ OTP Sent!";
      document.getElementById("otpBox").style.display = "block";
    })
    .catch((error) => {
      msg.innerHTML = "❌ " + error.message;
    });
};


// -----------------------
// VERIFY OTP
// -----------------------
verifyBtn.onclick = () => {
  let otp = document.getElementById("otp").value;

  confirmationResult.confirm(otp)
    .then((res) => {
      msg.innerHTML = "🎉 Login Success! Redirecting...";
      setTimeout(() => location.href = "index.html", 1500);
    })
    .catch(() => {
      msg.innerHTML = "❌ Invalid OTP";
    });
};

</script>

</body>
</html>
