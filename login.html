<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login / Register</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{
  max-width:420px;margin:20px auto;background:#fff;padding:20px;
  border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)
}
input,button{
  width:100%;margin:8px 0;padding:10px;
  border-radius:6px;border:1px solid #ccc;font-size:16px
}
button{
  background:#007bff;color:white;border:none;cursor:pointer
}
button:disabled{background:#999;cursor:not-allowed}
#recaptcha-container{margin-top:10px;}
</style>
</head>

<body>

<div class="card">
<h2>Login / Register</h2>

<input id="name" placeholder="Your Name">
<input id="college" placeholder="College Name">
<input id="email" placeholder="Gmail ID">
<input id="phone" placeholder="+91...">

<div id="recaptcha-container"></div>

<button id="sendotp">Send OTP</button>

<div id="otpBox" style="display:none">
  <input id="otp" placeholder="Enter OTP">
  <button id="verify">Verify & Login</button>
</div>

<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import firebaseConfig from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ---------------------------
// Fix Recaptcha for Firebase v9
// ---------------------------
window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {
    size: "invisible"
  }
);

// ---------------------------
// Send OTP
// ---------------------------
const msg = document.getElementById("msg");
document.getElementById("sendotp").onclick = async () => {
  let name = document.getElementById("name").value.trim();
  let col  = document.getElementById("college").value.trim();
  let email= document.getElementById("email").value.trim();
  let phone= document.getElementById("phone").value.trim();

  if(!name || !col || !email || !phone){
    msg.innerHTML = "⚠ Fill all fields";
    return;
  }

  msg.innerHTML = "⏳ Sending OTP...";

  try {
    const confirmation = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
    window.confirmationResult = confirmation;

    msg.innerHTML = "✔ OTP Sent!";
    document.getElementById("otpBox").style.display = "block";
  } catch (e) {
    msg.innerHTML = "❌ " + e.message;
  }
};

// ---------------------------
// Verify OTP
// ---------------------------
document.getElementById("verify").onclick = async () => {
  let otp = document.getElementById("otp").value.trim();

  try {
    await window.confirmationResult.confirm(otp);

    msg.innerHTML = "🎉 Login Successful!";
    setTimeout(() => location.href = "index.html", 1500);

  } catch (e) {
    msg.innerHTML = "❌ Invalid OTP";
  }
};
</script>

</body>
</html>
