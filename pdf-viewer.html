<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected PDF Viewer</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
.top{padding:15px;background:#222;text-align:center;font-size:18px}
#viewer{display:flex;flex-wrap:wrap;justify-content:center;padding:10px}
canvas{margin:8px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.lock-msg{background:#fff;color:#000;padding:20px;margin:10px;border-radius:8px;font-size:18px}
a{color:#0af}
</style>
</head>
<body>
<div class="top">PDF Preview (First 10 pages only) — <a href="login.html">Login to unlock full PDF</a></div>
<div id="viewer"></div>

<script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import firebaseConfig from './firebase-config.js';
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let logged = false;
onAuthStateChanged(auth, u => { logged = !!u; render(); });

const urlParams = new URLSearchParams(window.location.search);
const pdfUrl = urlParams.get("file") || "sample.pdf";

async function render(){
  const viewer=document.getElementById("viewer");
  viewer.innerHTML="";
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://mozilla.github.io/pdf.js/build/pdf.worker.js';
  try{
    const pdf=await pdfjsLib.getDocument(pdfUrl).promise;
    const total=pdf.numPages;
    const limit = logged? total: Math.min(10,total);
    for(let i=1;i<=limit;i++){
      const page=await pdf.getPage(i);
      const viewport=page.getViewport({scale:1.2});
      const canvas=document.createElement("canvas");
      canvas.width=viewport.width; canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
      viewer.appendChild(canvas);
    }
    if(!logged && total>10){
      const div=document.createElement("div");
      div.className="lock-msg";
      div.innerHTML="Only first 10 pages visible.<br>Login to view full PDF.";
      viewer.appendChild(div);
    }
  }catch(e){
    viewer.innerHTML="Error loading PDF: "+e;
  }
}
</script>
</body></html>
