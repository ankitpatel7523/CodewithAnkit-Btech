<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login / Register</title>

<!-- Your reCAPTCHA SITE KEY -->
<script src="https://www.google.com/recaptcha/api.js?render=6Lff3hQsAAAAAMWlm9vCL4kZLmhIs-TE7slxVHxi"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{
  max-width:420px;margin:20px auto;background:#fff;padding:20px;
  border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)
}
input,button{
  width:100%;margin:8px 0;padding:12px;
  border-radius:6px;border:1px solid #ccc;font-size:16px;
}
button{
  background:#007bff;color:#fff;border:none;cursor:pointer;font-weight:bold
}
button:disabled{background:#999;cursor:not-allowed}
#recaptcha-container{margin-top:10px;display:none;}
</style>

</head>
<body>

<div class="card">
<h2>Login / Register</h2>

<input id="name" placeholder="Your Name">
<input id="college" placeholder="College Name">
<input id="email" placeholder="Gmail ID">
<input id="phone" placeholder="+91...">

<button id="sendotp">Send OTP</button>

<div id="otpBox" style="display:none">
  <input id="otp" placeholder="Enter OTP">
  <button id="verify">Verify & Login</button>
</div>

<p id="msg"></p>

<!-- recaptcha placeholder -->
<div id="recaptcha-container"></div>

</div>


<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script type="module">
import firebaseConfig from "./firebase-config.js";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ---------------------------
// reCAPTCHA + TOKEN GENERATION
// ---------------------------
let recaptchaVerifier;

grecaptcha.ready(() => {
  grecaptcha.execute("6Lff3hQsAAAAAMWlm9vCL4kZLmhIs-TE7slxVHxi", {action:'submit'})
  .then(() => {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: "invisible"
    });
    recaptchaVerifier.render();
  });
});

const msg = document.getElementById("msg");

// ---------------------------
// SEND OTP
// ---------------------------
document.getElementById("sendotp").onclick = () => {

  let name = document.getElementById("name").value.trim();
  let college = document.getElementById("college").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();

  if(!name || !college || !email || !phone){
    msg.innerHTML = "⚠ Please fill all fields!";
    return;
  }

  msg.innerHTML = "⏳ Sending OTP...";

  auth.signInWithPhoneNumber(phone, recaptchaVerifier)
    .then((res) => {
      window.confirmationResult = res;
      msg.innerHTML = "✔ OTP Sent!";
      document.getElementById("otpBox").style.display = "block";
    })
    .catch((err) => {
      msg.innerHTML = "❌ " + err.message;
    });
};


// ---------------------------
// VERIFY OTP
// ---------------------------
document.getElementById("verify").onclick = () => {
  let otp = document.getElementById("otp").value;

  confirmationResult.confirm(otp)
    .then(() => {
      msg.innerHTML = "🎉 Login Successful!";
      setTimeout(() => location.href = "index.html", 1200);
    })
    .catch(() => {
      msg.innerHTML = "❌ Invalid OTP";
    });
};

</script>

</body>
</html>
