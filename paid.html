
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paid Batches</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    h1 { color: #0d47a1; text-align: center; }
    .batch-container { max-width: 1000px; margin: auto; }
    .batch-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      margin-bottom: 20px;
    }
    .batch-card img {
      width: 100%;
      border-radius: 10px;
    }
    .batch-card h3 { margin-top: 10px; color: #0d47a1; }
    .batch-card p { margin: 10px 0; }
    .batch-card a {
      display: inline-block;
      padding: 10px 20px;
      background: #0d47a1;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>📚 Available Paid Batches</h1>
  <div class="batch-container" id="batchList"></div>

  <script>
    const batches = JSON.parse(localStorage.getItem('batches') || '[]');
    const container = document.getElementById('batchList');
    if (batches.length === 0) {
      container.innerHTML = "<p>No batches available.</p>";
    } else {
      batches.forEach(b => {
        const div = document.createElement('div');
        div.className = "batch-card";
        div.innerHTML = `
          <img src="${b.thumbnail}" alt="Thumbnail" />
          <h3>${b.title}</h3>
          <p>${b.description}</p>
          <a href="${b.link}" target="_blank">Buy Now</a>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
