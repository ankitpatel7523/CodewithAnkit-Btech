<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{max-width:420px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
input,button{width:100%;margin:8px 0;padding:10px;border-radius:6px;border:1px solid #ccc}
#recaptcha-container{margin:10px 0}
</style>
</head>
<body>
<div class="card">
<h2>Login / Register</h2>
<input id="name" placeholder="Your Name">
<input id="college" placeholder="College Name">
<input id="email" placeholder="Gmail ID">
<input id="phone" placeholder="+91...">
<div id="recaptcha-container"></div>
<button id="sendotp">Send OTP</button>
<div id="otpBox" style="display:none">
  <input id="otp" placeholder="Enter OTP">
  <button id="verify">Verify & Login</button>
</div>
<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import firebaseConfig from './firebase-config.js';

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
window.recaptchaVerifier=new RecaptchaVerifier('recaptcha-container',{'size':'invisible'},auth);

const msg=document.getElementById("msg");
document.getElementById("sendotp").onclick=async()=>{
  let name=document.getElementById("name").value.trim();
  let col=document.getElementById("college").value.trim();
  let email=document.getElementById("email").value.trim();
  let phone=document.getElementById("phone").value.trim();
  if(!name||!col||!email||!phone){msg.innerText="Fill all fields";return;}
  msg.innerText="Sending OTP...";
  try{
    const r=await signInWithPhoneNumber(auth,phone,window.recaptchaVerifier);
    window.cr=r;
    msg.innerText="OTP Sent!";
    document.getElementById("otpBox").style.display="block";
  }catch(e){msg.innerText=e;}
};

document.getElementById("verify").onclick=async()=>{
  let otp=document.getElementById("otp").value.trim();
  let name=document.getElementById("name").value.trim();
  let col=document.getElementById("college").value.trim();
  let email=document.getElementById("email").value.trim();

  try{
    const res=await window.cr.confirm(otp);
    msg.innerText="Logged In!";
    // notify admin cloud function
    fetch("https://<YOUR_REGION>-<YOUR_PROJECT>.cloudfunctions.net/api/sendUserNotification",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,college:col,email,phone:res.user.phoneNumber})
    });
    setTimeout(()=>location.href="index.html",1000);
  }catch(e){msg.innerText="OTP error: "+e;}
};
</script>
</body></html>
